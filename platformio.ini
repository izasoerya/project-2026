; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32@6.6.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_filters = time
build_flags = 
    -D ELEGANTOTA_USE_ASYNC_WEBSERVER=1
    -D TFT_ESPI_USER_SETUP_PATH=\"$PROJECT_DIR/include/display/display_tft_spi_lcd/user_setup.h\" ; If using TFT LCD
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

[env:pikohidro]
build_src_filter = +<*> -<projects/*/*.cpp> +<projects/pikohidro/main.cpp>
lib_deps =
    ayushsharma82/ElegantOTA@^3.1.7
    ayushsharma82/WebSerial@^2.1.2
    blynkkk/Blynk@^1.3.5
    adafruit/Adafruit SSD1306@^2.5.17
    robtillaart/INA219@^0.4.2
    ciniml/WireGuard-ESP32 @ ^0.1.5
    https://github.com/addicore/ads1115.git#c0052e817affb838028aaa5ed86f8ea9ec8ce849
    https://github.com/johnrickman/LiquidCrystal_I2C.git#738765e388816fb2a687d40436cd2604febce1b1

[env:aquaponics]
build_src_filter = +<*> -<projects/*/*.cpp> +<projects/aquaponic/main.cpp>
lib_deps = 
    ayushsharma82/ElegantOTA@^3.1.7
    ayushsharma82/WebSerial@^2.1.2
    blynkkk/Blynk@^1.3.5
