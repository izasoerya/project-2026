    robtillaart/DS18B20@^0.2.7
    robtillaart/ADS1X15@^0.6.2
    artronshop/ArtronShop_BH1750@^1.0.0
    ciniml/WireGuard-ESP32 @ ^0.1.5
    https://github.com/johnrickman/LiquidCrystal_I2C.git#738765e388816fb2a687d40436cd2604febce1b1
    https://github.com/addicore/ads1115.git#c0052e817affb838028aaa5ed86f8ea9ec8ce849

[env:bandung-persemaian-master]
